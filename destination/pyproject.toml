[project]
name = "shmem-reader"
dynamic = ["version"]
description = "POSIX shared memory reader for high-performance inter-container data transfer"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["shared-memory", "ipc", "posix", "numpy", "hpc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.26.0",
    "posix-ipc>=1.1.0; sys_platform == 'linux'",
]

[project.scripts]
shmem-reader = "shmem_reader.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../VERSION.txt"
pattern = "(?P<version>[^\n]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/shmem_reader"]

[dependency-groups]
dev = ["pytest>=8.0"]
